name: awlauncher
description: "The AWLauncher window: Material 3 on Flutter, over the awcore launcher core."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  material_color_utilities: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex-Variable.ttf
