name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir dist
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; else version=$(git describe --tags --match 'v*' --always); fi
          echo "Version: $version"
          echo "AW_VERSION=$version" >> "$GITHUB_ENV"
          stamp="-X github.com/TheGreatPepix/awlauncher/internal/launcher.Version=$version"
          go build -trimpath -ldflags "-s -w -H=windowsgui $stamp" -o dist/AWLauncher.exe ./cmd/awlauncher
          ls -l dist

      - name: Installer
        run: |
          find_iscc() {
            for p in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
              [ -f "$p" ] && { echo "$p"; return; }
            done
          }
          iscc=$(find_iscc)
          if [ -z "$iscc" ]; then
            choco install innosetup --yes --no-progress
            iscc=$(find_iscc)
          fi
          app_version=${AW_VERSION#v}
          core=
          if [[ $AW_VERSION =~ ^v([0-9]+(\.[0-9]+){0,2})(-|$) ]]; then core=${BASH_REMATCH[1]}; fi
          IFS=. read -r major minor patch <<< "${core:-0}"
          file_version="${major:-0}.${minor:-0}.${patch:-0}.0"
          echo "Installer version: $app_version ($file_version)"
          "$iscc" -Q "-DAppVersion=$app_version" "-DFileVersion=$file_version" installer/awlauncher.iss
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: AWLauncher-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error

  # The Flutter window with awcore beside it. It replaces the WebView build
  # once the migration is done; until then it is built next to it.
  window:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Core
        working-directory: .
        run: |
          version=$(git describe --tags --match 'v*' --always)
          stamp="-X github.com/TheGreatPepix/awlauncher/internal/launcher.Version=$version"
          go build -trimpath -ldflags "-s -w -H=windowsgui $stamp" -o dist-core/awcore.exe ./cmd/awcore

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Test
        run: AWCORE="$GITHUB_WORKSPACE/dist-core/awcore.exe" flutter test

      - name: Build
        run: |
          flutter build windows --release
          cp ../dist-core/awcore.exe build/windows/x64/runner/Release/
          ls -l build/windows/x64/runner/Release

      - uses: actions/upload-artifact@v4
        with:
          name: AWLauncher-window-${{ github.sha }}
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Test the window
        working-directory: app
        run: |
          go build -o "$RUNNER_TEMP/awcore" ../cmd/awcore
          flutter pub get
          flutter analyze
          AWCORE="$RUNNER_TEMP/awcore" flutter test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AWLauncher-${{ github.sha }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
