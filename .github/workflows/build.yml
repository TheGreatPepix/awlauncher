name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

defaults:
  run:
    shell: bash

jobs:
  # The WebView launcher. Its code goes away once the Flutter launcher has
  # replaced it; until then it is built and tested, but not released.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          version=$(git describe --tags --match 'v*' --always)
          stamp="-X github.com/TheGreatPepix/awlauncher/internal/launcher.Version=$version"
          go build -trimpath -ldflags "-s -w -H=windowsgui $stamp" -o dist-webview/AWLauncher.exe ./cmd/awlauncher
          ls -l dist-webview

      - uses: actions/upload-artifact@v4
        with:
          name: AWLauncher-webview-${{ github.sha }}
          path: dist-webview/AWLauncher.exe
          if-no-files-found: error

  # The Flutter launcher: the window with awcore beside it, as a folder, a
  # portable zip and an installer, and the bridge that moves 0.5 to it.
  window:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Version
        working-directory: .
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; else version=$(git describe --tags --match 'v*' --always); fi
          core=
          if [[ $version =~ ^v([0-9]+(\.[0-9]+){0,2})(-|$) ]]; then core=${BASH_REMATCH[1]}; fi
          IFS=. read -r major minor patch <<< "${core:-0}"
          build=0
          if [[ $version =~ -([0-9]+)-g[0-9a-f]+$ ]]; then build=${BASH_REMATCH[1]}; fi
          {
            echo "AW_VERSION=$version"
            echo "AW_APP_VERSION=${version#v}"
            echo "AW_NAME=${major:-0}.${minor:-0}.${patch:-0}"
            echo "AW_BUILD=$build"
          } >> "$GITHUB_ENV"
          echo "Version: $version (${major:-0}.${minor:-0}.${patch:-0}+$build)"

      - name: Core
        working-directory: .
        run: |
          stamp="-X github.com/TheGreatPepix/awlauncher/internal/launcher.Version=$AW_VERSION"
          go build -trimpath -ldflags "-s -w -H=windowsgui $stamp" -o dist-core/awcore.exe ./cmd/awcore

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Test
        run: AWCORE="$GITHUB_WORKSPACE/dist-core/awcore.exe" flutter test

      - name: Build
        run: |
          flutter build windows --release --build-name "$AW_NAME" --build-number "$AW_BUILD"
          cp ../dist-core/awcore.exe build/windows/x64/runner/Release/
          mkdir -p ../dist
          cp -r build/windows/x64/runner/Release ../dist/app
          ls -l ../dist/app

      - name: Portable zip
        working-directory: dist/app
        run: 7z a -tzip ../AWLauncher-portable.zip . > /dev/null

      - name: Installer
        working-directory: .
        run: |
          find_iscc() {
            for p in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
              [ -f "$p" ] && { echo "$p"; return; }
            done
          }
          iscc=$(find_iscc)
          if [ -z "$iscc" ]; then
            choco install innosetup --yes --no-progress
            iscc=$(find_iscc)
          fi
          "$iscc" -Q "-DAppVersion=$AW_APP_VERSION" "-DFileVersion=$AW_NAME.$AW_BUILD" installer/awlauncher.iss

      - name: Bridge from 0.5
        working-directory: .
        run: |
          cp dist/AWLauncher-Setup.exe cmd/awbridge/payload/
          stamp="-X github.com/TheGreatPepix/awlauncher/internal/launcher.Version=$AW_VERSION"
          go build -trimpath -ldflags "-s -w -H=windowsgui $stamp" -o dist/AWLauncher.exe ./cmd/awbridge
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: AWLauncher-window-${{ github.sha }}
          path: dist/app/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AWLauncher-${{ github.sha }}
          path: |
            dist/AWLauncher-Setup.exe
            dist/AWLauncher-portable.zip
            dist/AWLauncher.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Test the window
        working-directory: app
        run: |
          go build -o "$RUNNER_TEMP/awcore" ../cmd/awcore
          flutter pub get
          flutter analyze
          AWCORE="$RUNNER_TEMP/awcore" flutter test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, window, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AWLauncher-${{ github.sha }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/AWLauncher-Setup.exe dist/AWLauncher-portable.zip dist/AWLauncher.exe --clobber
